<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BRILL Barbershop | Галерея</title>
    <meta
      name="description"
      content="Editorial gallery BRILL: стрижки, борода, интерьер и процесс работы барберов."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Manrope:wght@400;500;700&family=Oswald:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/barbershop-brill/assets/main-CqIZOpgD.js"></script>
    <link rel="stylesheet" crossorigin href="/barbershop-brill/assets/main-B7kdDxVK.css">
  </head>
  <body data-page="gallery">
    <div class="site-shell" data-shell>
      <section class="page-frame" data-page-root data-label="Галерея">
        <div class="page-inner">
          <header class="page-title">
            <div class="page-title-copy">
              <h1 class="section-title">Галерея</h1>
              <p class="gallery-caption">
                Живая подборка BRILL: чистые фейды, точная борода, тёмный интерьер и ритуал работы
                в деталях.
              </p>
            </div>
          </header>

          <section class="gallery-layout">
            <div class="gallery-filters">
              <button class="filter-button is-active" type="button" data-filter="all">Все</button>
              <button class="filter-button" type="button" data-filter="haircut">Стрижки</button>
              <button class="filter-button" type="button" data-filter="beard">Борода</button>
              <button class="filter-button" type="button" data-filter="interior">Интерьер</button>
              <button class="filter-button" type="button" data-filter="process">Процесс</button>
            </div>
            <div class="gallery-grid" data-gallery-grid></div>
          </section>

          <div class="gallery-actions">
            <a class="ghost-button" href="contacts.html#route">Показать ещё</a>
          </div>
        </div>
      </section>
    </div>

    <div class="lightbox" data-lightbox>
      <div class="lightbox-inner">
        <button class="lightbox-close" type="button" aria-label="Закрыть" data-lightbox-close>×</button>
        <div class="lightbox-image-wrap">
          <img src="" alt="" data-lightbox-image />
        </div>
        <div class="lightbox-meta">
          <strong data-lightbox-title></strong>
          <span data-lightbox-category></span>
        </div>
        <div class="lightbox-controls">
          <button class="lightbox-button" type="button" aria-label="Предыдущее фото" data-lightbox-prev>←</button>
          <button class="lightbox-button" type="button" aria-label="Следующее фото" data-lightbox-next>→</button>
        </div>
      </div>
    </div>

  </body>
</html>
